name: Run Telegram Bot Alert

on:
  schedule:
    # Runs every 10 minutes. Adjust the cron expression if needed.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to manually trigger the script from GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run script with tokens directly embedded
      - name: Run script
        env:
          TG_BOT_TOKEN: "YOUR_ACTUAL_BOT_TOKEN"
          TG_CHAT_ID: "YOUR_ACTUAL_CHAT_ID"
        run: python script.py